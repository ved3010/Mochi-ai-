<?xml version="1.0" encoding="UTF-8"?>
<svg width="50" height="50" viewBox="-2 -2 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      :root {
        --cat-color: #8ce5ff;
        --cat-outline: #FFFFFF;
      }
      .pupil-left, .pupil-right {
        transform-box: fill-box;
        transform-origin: center;
      }
    ]]></style>

    <linearGradient id="blob-body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ce5ff" />
      <stop offset="35%" stop-color="#a4ddfe" />
      <stop offset="62%" stop-color="#b6befe" />
      <stop offset="85%" stop-color="#caa5fe" />
      <stop offset="100%" stop-color="#d4acfe" />
    </linearGradient>

    <!-- Round 3D Top Dome Glow -->
    <radialGradient id="blob-top-glow" cx="50%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="blob-back-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c58c2" />
      <stop offset="100%" stop-color="#8d68d4" />
    </linearGradient>

    <linearGradient id="blob-arm-l" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a8eaff" />
      <stop offset="50%" stop-color="#c1b6fe" />
      <stop offset="100%" stop-color="#caa3fe" />
    </linearGradient>

    <linearGradient id="blob-arm-r" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#a8eaff" />
      <stop offset="50%" stop-color="#c1b6fe" />
      <stop offset="100%" stop-color="#caa3fe" />
    </linearGradient>

    <radialGradient id="pupil-gloss" cx="38%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#FFFFFF" />
      <stop offset="32%" stop-color="#111119" />
      <stop offset="88%" stop-color="#111119" />
      <stop offset="100%" stop-color="#28223a" />
    </radialGradient>

    <filter id="blush-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <!-- Zero Black Border Filter: Soft ambient shadow + white rim -->
    <filter id="cat-outline" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#6b46b8" flood-opacity="0.32"/>
      <feMorphology operator="dilate" radius="0.5" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.85" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="whiteRim"/>
      <feMerge>
        <feMergeNode in="whiteRim"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="cat-content" filter="url(#cat-outline)">

    <!-- Blob Back Skirt -->
    <g fill="url(#blob-back-skirt)" transform="rotate(-2 20 26)">
      <path d="M 9 29 C 9 34.5, 14 34.5, 14.5 30
               C 14.5 35, 19.5 35, 20 30
               C 20 35, 25 35, 25.5 30
               C 25.5 34.5, 30.5 34.5, 31 29 Z" />
    </g>

    <!-- Blob Body Dome (Round Hemisphere Top) -->
    <g id="body" transform="rotate(-2 20 26)">
      <path fill="url(#blob-body-grad)" d="
        M 5 14
        C 5 5.5, 11.7 -1.2, 20 -1.2
        C 28.3 -1.2, 35 5.5, 35 14
        C 35 19.5, 34.5 24.5, 30.5 30.5
        C 28.5 30.5, 27.5 28.0, 25.5 28.0
        C 23.5 28.0, 22.5 31.0, 20.0 31.0
        C 17.5 31.0, 16.5 28.0, 14.5 28.0
        C 12.5 28.0, 11.5 30.5, 9.5 30.5
        C 5.5 24.5, 5 19.5, 5 14 Z" />

      <path fill="url(#blob-top-glow)" d="
        M 6.5 14
        C 6.5 6.8, 12.5 0.5, 20 0.5
        C 27.5 0.5, 33.5 6.8, 33.5 14
        C 30 11.5, 25 10, 20 10
        C 15 10, 10 11.5, 6.5 14 Z" />
    </g>

    <!-- Keyboards -->
    <!-- Left Keyboard (PRESSED DOWN by left paw) -->
    <path d="M4 33V32H5V31H18V32H19V35H18V38H17V40H16V42H1V41H0V39H1V37H2V35H3V33H4Z" fill="#999797"/>
    <path d="M0 41H1V42H16V44H15H2V43H1V42H0V41Z" fill="#605E5E"/>
    <path d="M16 44H15V42H16V40H17V38H18V35H19V33H20V35.5H19V38.5H18V41H17V43H16V44Z" fill="#222222"/>
    <rect x="2" y="41" width="13" height="1" fill="#D7D6D6"/>
    <rect y="39" width="1" height="1" fill="#D9D9D9"/>
    <rect x="1" y="40" width="1" height="1" fill="#D9D9D9"/>
    <rect x="15" y="40" width="1" height="1" fill="#D9D9D9"/>
    <rect x="16" y="39" width="1" height="1" fill="#D9D9D9"/>

    <!-- Right Keyboard (RESTING UP) -->
    <path d="M24 29V28H25V27H38V28H39V31H38V34H37V36H36V38H21V37H20V35H21V33H22V31H23V29H24Z" fill="#999797"/>
    <path d="M20 37H21V38H36V44H35H22V43H21V42H20V37Z" fill="#605E5E"/>
    <path d="M36 44H35V42H36V36H37V34H38V31H39V29H40V35.5H39V38.5H38V41H37V43H36V44Z" fill="#222222"/>
    <rect x="22" y="37" width="13" height="1" fill="#D7D6D6"/>
    <rect x="20" y="35" width="1" height="1" fill="#D9D9D9"/>
    <rect x="21" y="36" width="1" height="1" fill="#D9D9D9"/>
    <rect x="35" y="36" width="1" height="1" fill="#D9D9D9"/>
    <rect x="36" y="35" width="1" height="1" fill="#D9D9D9"/>

    <!-- Left Arm Pressing Down onto Keyboard -->
    <g id="leg-fl">
      <path fill="url(#blob-arm-l)" d="M 6 23 C 3 24, 0 28, 2 33 C 3.5 36, 7 35.5, 9 32 C 10.5 29.5, 9.5 24.5, 6 23 Z" />
      <ellipse cx="4.5" cy="28.5" rx="1.6" ry="2.6" fill="#ffffff" opacity="0.28" transform="rotate(-25 4.5 28.5)" />
    </g>

    <!-- Right Arm Lifted Up Ready -->
    <g id="leg-fr">
      <path fill="url(#blob-arm-r)" d="M 34 18 C 37 18.5, 39.5 21, 38.2 24 C 37.2 26, 34 26.5, 32 24.5 C 30.5 22.5, 31 19, 34 18 Z" />
      <ellipse cx="35.8" cy="22" rx="1.5" ry="2.2" fill="#ffffff" opacity="0.28" transform="rotate(15 35.8 22)" />
    </g>

    <!-- Head & Face (Focused cute typing expression) -->
    <g id="head" transform="rotate(-2 20 26)">
      <!-- Rosy Cheeks -->
      <ellipse cx="9.5" cy="18.5" rx="3.0" ry="2.0" fill="#ff7da8" opacity="0.75" filter="url(#blush-soft)"/>
      <ellipse cx="30.5" cy="18.5" rx="3.0" ry="2.0" fill="#ff7da8" opacity="0.75" filter="url(#blush-soft)"/>

      <!-- Mouth: Focused cute round "o" -->
      <ellipse cx="20.0" cy="19.8" rx="1.8" ry="2.4" fill="#111119"/>
      <ellipse cx="20.0" cy="20.8" rx="1.3" ry="1.1" fill="#ff648f" opacity="0.92"/>
    </g>

    <!-- Eyes (focused typing glance) -->
    <g id="eyes" transform="rotate(-2 20 26)">
      <g>
        <rect id="pupil-left" class="pupil-left" x="10.9" y="12.5" width="5.2" height="6.2" rx="2.6" ry="3.1" fill="url(#pupil-gloss)"/>
        <circle cx="14.5" cy="17.0" r="0.55" fill="#ffffff" opacity="0.9"/>
      </g>
      <g>
        <rect id="pupil-right" class="pupil-right" x="21.9" y="12.5" width="5.2" height="6.2" rx="2.6" ry="3.1" fill="url(#pupil-gloss)"/>
        <circle cx="25.5" cy="17.0" r="0.55" fill="#ffffff" opacity="0.9"/>
      </g>
    </g>

  </g>
</svg>