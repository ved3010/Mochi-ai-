<?xml version="1.0" encoding="UTF-8"?>
<svg width="40" height="62" viewBox="0 0 40 62" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --cat-color: #8ce5ff;
        --cat-outline: #FFFFFF;
      }
    </style>

    <linearGradient id="blob-body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ce5ff" />
      <stop offset="35%" stop-color="#a4ddfe" />
      <stop offset="62%" stop-color="#b6befe" />
      <stop offset="85%" stop-color="#caa5fe" />
      <stop offset="100%" stop-color="#d4acfe" />
    </linearGradient>

    <!-- Round 3D Top Dome Glow -->
    <radialGradient id="blob-top-glow" cx="50%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="blob-back-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c58c2" />
      <stop offset="100%" stop-color="#8d68d4" />
    </linearGradient>

    <linearGradient id="blob-arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8eaff" />
      <stop offset="100%" stop-color="#caa3fe" />
    </linearGradient>

    <radialGradient id="pupil-gloss-jump" cx="38%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="34%" stop-color="#111119" />
      <stop offset="100%" stop-color="#28223a" />
    </radialGradient>

    <filter id="blush-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <!-- Zero Black Border Filter -->
    <filter id="cat-outline" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#6b46b8" flood-opacity="0.32"/>
      <feMorphology operator="dilate" radius="0.5" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.85" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="whiteRim"/>
      <feMerge>
        <feMergeNode in="whiteRim"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="cat-content" filter="url(#cat-outline)">
    <!-- Stretch effect: soaring high up, tentacles trailing -->
    <g fill="url(#blob-back-skirt)">
      <path d="M 7 42 C 7 48.5, 12 49, 13 43 C 13 49, 18 49.5, 19 43 C 19 49.5, 24 49, 25 43 C 25 49, 30 48.5, 31 42 Z"/>
    </g>

    <!-- Round Soaring Bouncy Body -->
    <path fill="url(#blob-body-grad)" d="
      M 5 20
      C 5 9.0, 11.7 1.0, 20 1.0
      C 28.3 1.0, 35 9.0, 35 20
      C 35 28.0, 34.2 38.0, 30.5 44.5
      C 28.5 44.5, 27.5 41.5, 25.5 41.5
      C 23.5 41.5, 22.5 45.0, 20.0 45.0
      C 17.5 45.0, 16.5 41.5, 14.5 41.5
      C 12.5 41.5, 11.5 44.5, 9.5 44.5
      C 5.8 38.0, 5 28.0, 5 20 Z"/>

    <path fill="url(#blob-top-glow)" d="
      M 6.5 20
      C 6.5 10.5, 12.5 2.5, 20 2.5
      C 27.5 2.5, 33.5 10.5, 33.5 20
      C 30 16, 25 14, 20 14
      C 15 14, 10 16, 6.5 20 Z"/>

    <!-- Happy arms raised high in the air! \(^▽^)// -->
    <path fill="url(#blob-arm)" d="M 6.5 22 C 3.5 17, 0.5 11, 2.5 8 C 4.5 6, 8 9, 10 15 C 11.5 18.5, 10 22, 6.5 22 Z"/>
    <path fill="url(#blob-arm)" d="M 33.5 22 C 36.5 17, 39.5 11, 37.5 8 C 35.5 6, 32 9, 30 15 C 28.5 18.5, 30 22, 33.5 22 Z"/>

    <!-- Blush -->
    <ellipse cx="9.5" cy="22.5" rx="3.0" ry="2.0" fill="#ff7da8" opacity="0.75" filter="url(#blush-soft)"/>
    <ellipse cx="30.5" cy="22.5" rx="3.0" ry="2.0" fill="#ff7da8" opacity="0.75" filter="url(#blush-soft)"/>

    <!-- Big sparkling eyes (thrilled!) -->
    <g>
      <rect x="11.5" y="16.5" width="5.5" height="6.6" rx="2.75" ry="3.3" fill="url(#pupil-gloss-jump)"/>
      <circle cx="15.2" cy="21.0" r="0.6" fill="#ffffff" opacity="0.9"/>
    </g>
    <g>
      <rect x="23.0" y="16.5" width="5.5" height="6.6" rx="2.75" ry="3.3" fill="url(#pupil-gloss-jump)"/>
      <circle cx="26.7" cy="21.0" r="0.6" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Thrilled happy singing mouth :D -->
    <path d="M 16.5 24.5 Q 20.0 29.5 23.5 24.5 Z" fill="#111119"/>
    <ellipse cx="20.0" cy="26.5" rx="2.0" ry="1.5" fill="#ff648f" opacity="0.92"/>
  </g>
</svg>